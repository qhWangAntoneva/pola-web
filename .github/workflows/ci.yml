name: CI

on:
  push:
    branches:
      - gh-pages

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate HTML
        run: |
          # Basic health check — ensure index.html exists and is non-empty
          if [ ! -f index.html ]; then
            echo "❌ index.html not found!"
            exit 1
          fi
          if [ ! -s index.html ]; then
            echo "❌ index.html is empty!"
            exit 1
          fi
          echo "✅ index.html exists and is non-empty"

          # Check critical files exist
          for f in style.css py/analyze.py py/visualize.py .nojekyll; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing: $f"
              exit 1
            fi
            echo "✅ Found: $f"
          done
